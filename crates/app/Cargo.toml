[package]
name = "pigmentlab"
version.workspace = true
edition.workspace = true

[dependencies]
pigmentlab-core = { path = "../core" }
slint = { version = "1.18", features = ["unstable-wgpu-30", "renderer-femtovg-wgpu", "raw-window-handle-06"] }
rfd = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSImage", "NSResponder", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18"
