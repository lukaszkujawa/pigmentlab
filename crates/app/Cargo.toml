[package]
name = "pigmentlab"
version.workspace = true
edition.workspace = true

[dependencies]
pigmentlab-core = { path = "../core" }
slint = { version = "1.18", features = ["unstable-wgpu-30", "renderer-femtovg-wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSImage", "NSResponder", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }
block2 = "0.6"

[build-dependencies]
slint-build = "1.18"
